<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0a0e14">
<link rel="icon" href="./icon.png">
<title>Долговой трекер</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --card:#121822; --card2:#182030; --bd:#243044; --bd2:#2f3d55;
  --tx:#e8eef7; --mut:#8b9ab0; --mut2:#5d6b82;
  --grn:#22c55e; --grn2:#16a34a; --red:#ef4444; --org:#f59e0b; --cyan:#22d3ee; --blu:#3b82f6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;
  padding:0 0 90px;font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0}
.mut{color:var(--mut)} .mut2{color:var(--mut2)} .sm{font-size:13px} .xs{font-size:11.5px}
.b{font-weight:700}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(10,14,20,.92);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding:10px 14px 0}
.top-in{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;padding-bottom:9px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--grn);
  box-shadow:0 0 12px var(--grn);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.2px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:600 13.5px Inter,sans-serif;
  padding:11px 6px;cursor:pointer;border-bottom:2.5px solid transparent;transition:.18s}
.tabs button.on{color:var(--tx);border-color:var(--cyan)}

/* ---------- карточки ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(160deg,#16203099,#0f1620);border:1px solid var(--bd2);
  border-radius:20px;padding:20px 18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:-40% -30% auto auto;width:220px;height:220px;
  background:radial-gradient(circle,rgba(34,211,238,.13),transparent 70%);pointer-events:none}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut2);font-weight:600}
.big{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:800;letter-spacing:-1.5px;
  line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.big .cc{font-size:22px;color:var(--mut);margin-left:2px}
.grow{display:inline-flex;align-items:center;gap:6px;background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:999px;
  padding:4px 11px;font-size:12.5px;font-weight:600;margin-top:8px}

/* ---------- прогресс ---------- */
.pbar{height:12px;background:#0c1017;border:1px solid var(--bd);border-radius:999px;
  overflow:hidden;margin:10px 0 8px;position:relative}
.pfill{height:100%;background:linear-gradient(90deg,var(--grn2),var(--grn),#4ade80);
  border-radius:999px;transition:width .7s cubic-bezier(.4,1.2,.4,1);
  box-shadow:0 0 14px rgba(34,197,94,.5);position:relative}
.pfill::after{content:'';position:absolute;inset:0;border-radius:999px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
  animation:shine 2.6s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.prow{display:flex;justify-content:space-between;font-size:12.5px}

/* ---------- ближайший платёж ---------- */
.next{background:linear-gradient(150deg,rgba(59,130,246,.14),rgba(34,211,238,.05));
  border:1.5px solid rgba(59,130,246,.34);border-radius:16px;padding:15px;margin-bottom:12px}
.next.due{background:linear-gradient(150deg,rgba(245,158,11,.16),rgba(245,158,11,.04));
  border-color:rgba(245,158,11,.45)}
.next.over{background:linear-gradient(150deg,rgba(239,68,68,.18),rgba(239,68,68,.05));
  border-color:rgba(239,68,68,.5)}
.nrow{display:flex;align-items:center;gap:12px}
.nsum{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:800;
  letter-spacing:-.6px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- список платежей ---------- */
.mhead{display:flex;align-items:center;gap:9px;margin:20px 2px 9px}
.mhead h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.mhead .ln{flex:1;height:1px;background:var(--bd)}
.mhead .sum{font-size:12px;color:var(--mut2);font-variant-numeric:tabular-nums}
.pay{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);
  border-radius:14px;padding:12px 13px;margin-bottom:8px;transition:.2s}
.pay.done{opacity:.5;background:#0e131b}
.pay.done .pname{text-decoration:line-through}
.pay.over{border-color:rgba(239,68,68,.5);background:linear-gradient(150deg,rgba(239,68,68,.09),var(--card))}
.pay.soon{border-color:rgba(245,158,11,.45)}
.dbox{width:46px;flex:none;text-align:center;background:var(--card2);border:1px solid var(--bd);
  border-radius:10px;padding:5px 0}
.dbox .d{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:800;line-height:1}
.dbox .m{font-size:9.5px;text-transform:uppercase;color:var(--mut2);letter-spacing:.05em;margin-top:2px}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:11.5px;color:var(--mut2);margin-top:2px}
.pamt{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tgl{flex:none;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--bd2);
  background:var(--card2);color:var(--mut);font-size:17px;cursor:pointer;transition:.18s;
  display:flex;align-items:center;justify-content:center}
.tgl:active{transform:scale(.9)}
.tgl.on{background:var(--grn2);border-color:var(--grn);color:#fff;box-shadow:0 0 14px rgba(34,197,94,.4)}

/* ---------- займы ---------- */
.loan{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--bd)}
.loan:last-child{border:0;padding-bottom:0}
.lname{flex:1;min-width:0}
.lname .n{font-weight:600;font-size:14px}
.lname .s{font-size:11.5px;color:var(--mut2);margin-top:1px}
.lsum{text-align:right;font-variant-numeric:tabular-nums}
.lsum .a{font-weight:700;font-size:14.5px}
.lsum .b2{font-size:11.5px;color:var(--mut2)}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--bd);border-radius:7px;
  padding:1px 7px;font-size:10.5px;color:var(--mut);margin-left:6px}

.btn{background:var(--card2);border:1px solid var(--bd2);color:var(--tx);border-radius:11px;
  padding:10px 15px;font:600 13.5px Inter,sans-serif;cursor:pointer;transition:.18s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--blu),#2563eb);border-color:#2563eb}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sep{border:0;border-top:1px solid var(--bd);margin:14px 0}
.empty{text-align:center;padding:40px 20px;color:var(--mut2)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
  background:var(--card2);border:1px solid var(--bd2);border-radius:12px;padding:11px 18px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.28s;z-index:60;
  box-shadow:0 12px 34px rgba(0,0,0,.5);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
input[type=number],input[type=text]{background:#0c1017;border:1px solid var(--bd2);color:var(--tx);
  border-radius:10px;padding:9px 11px;font:500 14px Inter,sans-serif;width:100%}
.ft{text-align:center;color:var(--mut2);font-size:11px;padding:20px 10px 6px;line-height:1.6}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <div class="brand"><span class="dot"></span><h1>Долговой трекер</h1>
    <span class="xs mut2" style="margin-left:auto" id="todayTag">—</span></div>
  <div class="tabs">
    <button data-tab="sum" class="on">Общий долг</button>
    <button data-tab="pay">График платежей</button>
  </div>
</div></div>

<div class="wrap" id="view"></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= ДАННЫЕ ИЗ СКРИНШОТОВ ======================= */
const ANCHOR='2026-08-16';           // дата, на которую взяты суммы досрочного погашения
const KEY='debt_tracker_v1';

const LOANS=[
 {id:'web',name:'Webbankir',payoff:31680.00,rate:0.8,off:false,pays:[
   ['2026-09-10',10100],['2026-10-12',10100],['2026-11-10',10100],
   ['2026-12-10',10100],['2027-01-11',10100],['2027-02-05',9500]]},

 {id:'bel',name:'Belkacredit',payoff:44080.39,rate:0.8,off:false,pays:[
   ['2026-06-03',19864.45,1],['2026-07-03',19864.45,1],['2026-08-02',19864.45,1],
   ['2026-09-01',19864.45],['2026-10-01',19864.45],['2026-10-31',19864.44]]},

 {id:'ocm',name:'One Click Money',payoff:50347.46,rate:0.77,off:false,pays:[
   ['2026-07-26',11493,1],['2026-08-10',11493,1],
   ['2026-08-25',11493],['2026-09-09',11493],['2026-09-24',11493],
   ['2026-10-09',11493],['2026-10-24',11493],['2026-11-08',11488.30]]},

 {id:'dsr',name:'Деньги Сразу',payoff:58811.50,rate:0.8,off:false,pays:[
   ['2026-08-22',10898],['2026-09-06',10898],['2026-09-21',10898],['2026-10-06',10898],
   ['2026-10-21',10898],['2026-11-05',10898],['2026-11-20',10898],['2026-12-04',10823.67]]},

 {id:'srd',name:'Срочноденьги',payoff:29281.10,rate:0.8,off:false,pays:[
   ['2026-08-07',14900,1],
   ['2026-09-06',14900],['2026-10-06',14900],['2026-11-05',14900],
   ['2026-12-05',14900],['2027-01-04',14882]]},

 {id:'grn',name:'Грин Мани',payoff:43485.68,rate:0.8,off:false,pays:[
   ['2026-07-30',7215.09,1],['2026-08-13',7215.09,1],
   ['2026-08-27',7215.09],['2026-09-10',7215.09],['2026-09-24',7215.09],
   ['2026-10-08',7215.09],['2026-10-22',7215.09],['2026-11-05',7215.09],
   ['2026-11-19',7215.09],['2026-12-03',7215.09],['2026-12-17',7215.09],
   ['2026-12-31',7213.59]]},

 {id:'viv',name:'Vivus',payoff:41272.00,rate:0.8,off:false,pays:[
   ['2026-09-12',27674],['2026-10-12',27674]]},

 {id:'alf',name:'Альфа',payoff:25685.86,rate:0.359,off:false,pays:[
   ['2026-06-04',4602.49,1],['2026-07-06',4602.49,1],['2026-08-04',4602.49,1],
   ['2026-09-04',4602.49],['2026-10-05',4602.49],['2026-11-05',4602.49],['2026-12-04',4602.49],
   ['2027-01-11',4602.49],['2027-02-04',4602.49],['2027-03-04',4602.49],['2027-04-05',4602.49],
   ['2027-05-04',5190.35]]},

 {id:'doz',name:'До Зарплаты',payoff:32248.00,rate:0.8,off:false,pays:[
   ['2026-09-03',36424]]}
];

/* ======================= СОСТОЯНИЕ ======================= */
let S={paid:{},off:{},rateAdj:{},view:'sum'};
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ======================= ДАТЫ ======================= */
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MONF=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const iso=d=>d.toISOString().slice(0,10);
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
function today(){const d=new Date();return iso(new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())));}
const days=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addD=(s,n)=>{const d=parse(s);d.setUTCDate(d.getUTCDate()+n);return iso(d);};
const human=s=>{const d=parse(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()];};
const money=n=>n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽';
const money0=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
function plural(n,a){const m=n%10,h=n%100;return n+' '+(m===1&&h!==11?a[0]:m>=2&&m<=4&&(h<10||h>=20)?a[1]:a[2]);}

/* ======================= ЛОГИКА ДОЛГА ======================= */
const active=()=>LOANS.filter(l=>!isOff(l));
const isOff=l=>S.off[l.id]!==undefined?S.off[l.id]:l.off;
const pkey=(l,p)=>l.id+'|'+p[0];
const isPaid=(l,p)=>S.paid[pkey(l,p)]!==undefined?!!S.paid[pkey(l,p)]:!!p[2];
const rateOf=l=>S.rateAdj[l.id]!==undefined?S.rateAdj[l.id]:l.rate;

/* остаток по графику: всё, что ещё не отмечено оплаченным */
function remaining(l){return l.pays.filter(p=>!isPaid(l,p)).reduce((s,p)=>s+p[1],0);}
function scheduledAll(l){return l.pays.reduce((s,p)=>s+p[1],0);}
function paidSum(l){return l.pays.filter(p=>isPaid(l,p)).reduce((s,p)=>s+p[1],0);}

/* дата, когда платёж реально отмечен пользователем (у старых платежей из
   скриншотов её нет — они уже учтены в сумме досрочного погашения) */
function markDate(l,p){const v=S.paid[pkey(l,p)];return typeof v==='string'?v:null;}

/* Долг на дату: тело растёт на r% в день, внесённые платежи вычитаются.
   Сверху ограничен остатком по графику — больше графика заплатить нельзя. */
function balanceOn(l,date){
  const r=rateOf(l)/100;
  const n=Math.max(0,days(ANCHOR,date));
  let bal=l.payoff;
  const marks=l.pays.filter(p=>isPaid(l,p)&&markDate(l,p)).map(p=>({p,when:markDate(l,p)}));
  /* внесённые в день отсчёта или раньше — снимаем сразу */
  marks.forEach(m=>{if(days(ANCHOR,m.when)<=0)bal-=m.p[1];});
  for(let i=1;i<=n;i++){
    bal*=(1+r);
    const day=addD(ANCHOR,i);
    marks.forEach(m=>{if(m.when===day)bal-=m.p[1];});
  }
  return Math.max(0,Math.min(bal,remaining(l)));
}
const totalOn=date=>active().reduce((s,l)=>s+balanceOn(l,date),0);

function stats(){
  const t=today();
  const now=totalOn(t), tmr=totalOn(addD(t,1));
  const paid=active().reduce((s,l)=>s+paidSum(l),0);
  const all=active().reduce((s,l)=>s+scheduledAll(l),0);
  const rem=active().reduce((s,l)=>s+remaining(l),0);
  return {now,tmr,grow:tmr-now,paid,all,rem,pct:all?paid/all*100:0};
}
function nextPay(){
  const t=today();let best=null;
  active().forEach(l=>l.pays.forEach(p=>{
    if(isPaid(l,p))return;
    if(!best||p[0]<best.p[0])best={l,p};
  }));
  return best;
}

/* ======================= ВКЛАДКА 1: ОБЩИЙ ДОЛГ ======================= */
function vSum(){
  const s=stats(),t=today(),nx=nextPay();
  let h='';

  h+=`<div class="hero">
    <div class="lbl">Общий долг на сегодня</div>
    <div class="big">${money0(s.now).replace(' ₽','')}<span class="cc">₽</span></div>
    <div class="grow">📈 +${money(s.grow)} за сутки · ${(rateAvg()).toFixed(2)}% в день</div>
    <div class="pbar"><div class="pfill" style="width:${Math.min(100,s.pct).toFixed(1)}%"></div></div>
    <div class="prow"><span class="b" style="color:var(--grn)">Выплачено ${s.pct.toFixed(1)}%</span>
      <span class="mut2">${money0(s.paid)} из ${money0(s.all)}</span></div>
  </div>`;

  if(nx){
    const d=days(t,nx.p[0]);
    const cls=d<0?'over':d<=3?'due':'';
    const when=d<0?`просрочен на ${plural(-d,['день','дня','дней'])}`
      :d===0?'сегодня':d===1?'завтра':`через ${plural(d,['день','дня','дней'])}`;
    h+=`<div class="next ${cls}">
      <div class="lbl">Ближайший платёж · ${when}</div>
      <div class="nrow" style="margin-top:8px">
        <div style="flex:1;min-width:0">
          <div class="b" style="font-size:16px">${nx.l.name}</div>
          <div class="sm mut">${human(nx.p[0])} ${nx.p[0].slice(0,4)}</div>
        </div>
        <div class="nsum">${money(nx.p[1])}</div>
        <button class="tgl" data-pay="${pkey(nx.l,nx.p)}">✓</button>
      </div></div>`;
  }

  h+=`<div class="card"><h2 style="font-size:15px;margin-bottom:4px">Долг по займам</h2>
    <div class="xs mut2" style="margin-bottom:10px">Слева — сегодня к погашению, справа — остаток по графику</div>`;
  active().sort((a,b)=>balanceOn(b,t)-balanceOn(a,t)).forEach(l=>{
    const b=balanceOn(l,t),rem=remaining(l),left=l.pays.filter(p=>!isPaid(l,p)).length;
    h+=`<div class="loan">
      <div class="lname"><div class="n">${l.name}<span class="chip">${rateOf(l)}%/д</span></div>
        <div class="s">${plural(left,['платёж','платежа','платежей'])} осталось</div></div>
      <div class="lsum"><div class="a">${money0(b)}</div><div class="b2">${money0(rem)}</div></div>
    </div>`;
  });
  h+=`</div>`;

  h+=`<div class="card"><h2 style="font-size:15px;margin-bottom:10px">Как считается</h2>
    <div class="sm mut" style="line-height:1.6">
      Долг взят на <b>${human(ANCHOR)}</b> (суммы досрочного погашения из личных кабинетов)
      и каждый день растёт на процентную ставку займа. Отмеченный платёж сразу вычитается.
      <br><br>Начисление ограничено остатком по графику: больше, чем стоит в графике,
      долг вырасти не может.</div>
    <hr class="sep">
    <div class="row"><button class="btn" data-act="settings">⚙️ Займы и ставки</button>
      <button class="btn" data-act="export">⬇ Экспорт</button>
      <button class="btn" data-act="import">⬆ Импорт</button></div>
  </div>`;

  h+=`<div class="ft">Данные хранятся только в этом браузере · Сборка 1.0</div>`;
  return h;
}
const rateAvg=()=>{const a=active();if(!a.length)return 0;
  const t=today(),tot=totalOn(t);if(!tot)return 0;
  return a.reduce((s,l)=>s+rateOf(l)*balanceOn(l,t),0)/tot;};

/* ======================= ВКЛАДКА 2: ГРАФИК ======================= */
function vPay(){
  const t=today();
  const all=[];
  active().forEach(l=>l.pays.forEach((p,i)=>all.push({l,p,i,n:i+1,tot:l.pays.length})));
  all.sort((a,b)=>a.p[0]<b.p[0]?-1:a.p[0]>b.p[0]?1:0);

  const up=all.filter(x=>!isPaid(x.l,x.p)), dn=all.filter(x=>isPaid(x.l,x.p));
  let h='';

  const m30=up.filter(x=>days(t,x.p[0])>=0&&days(t,x.p[0])<=30).reduce((s,x)=>s+x.p[1],0);
  h+=`<div class="card" style="display:flex;gap:14px;text-align:center">
    <div style="flex:1"><div class="lbl">Ближайшие 30 дней</div>
      <div class="b" style="font-size:19px;margin-top:4px">${money0(m30)}</div></div>
    <div style="width:1px;background:var(--bd)"></div>
    <div style="flex:1"><div class="lbl">Всего осталось</div>
      <div class="b" style="font-size:19px;margin-top:4px">${money0(stats().rem)}</div></div>
  </div>`;

  let cm='';
  up.forEach(x=>{
    const key=x.p[0].slice(0,7);
    if(key!==cm){
      cm=key;
      const [y,mo]=key.split('-');
      const msum=up.filter(z=>z.p[0].slice(0,7)===key).reduce((s,z)=>s+z.p[1],0);
      h+=`<div class="mhead"><h3>${MONF[+mo-1]} ${y}</h3><div class="ln"></div>
        <span class="sum">${money0(msum)}</span></div>`;
    }
    h+=payRow(x,t);
  });
  if(!up.length)h+=`<div class="empty">🎉 Все платежи отмечены</div>`;

  if(dn.length){
    h+=`<div class="mhead"><h3>Оплачено</h3><div class="ln"></div>
      <span class="sum">${money0(dn.reduce((s,x)=>s+x.p[1],0))}</span></div>`;
    dn.forEach(x=>h+=payRow(x,t));
  }
  return h;
}
function payRow(x,t){
  const d=parse(x.p[0]),done=isPaid(x.l,x.p),dd=days(t,x.p[0]);
  const cls=done?'done':dd<0?'over':dd<=3?'soon':'';
  const note=done?'внесён':dd<0?`просрочен ${plural(-dd,['день','дня','дней'])}`
    :dd===0?'сегодня':dd===1?'завтра':`через ${plural(dd,['день','дня','дней'])}`;
  return `<div class="pay ${cls}">
    <div class="dbox"><div class="d">${d.getUTCDate()}</div><div class="m">${MONS[d.getUTCMonth()]}</div></div>
    <div class="pinfo"><div class="pname">${x.l.name}</div>
      <div class="pmeta">платёж ${x.n} из ${x.tot} · ${note}</div></div>
    <div class="pamt">${money(x.p[1])}</div>
    <button class="tgl ${done?'on':''}" data-pay="${pkey(x.l,x.p)}">${done?'✓':'○'}</button>
  </div>`;
}

/* ======================= НАСТРОЙКИ ======================= */
function vSettings(){
  let h=`<div class="card"><h2 style="font-size:15px;margin-bottom:4px">Займы и ставки</h2>
    <div class="xs mut2" style="margin-bottom:12px">Выключенные не входят в общий долг</div>`;
  LOANS.forEach(l=>{
    const on=!isOff(l);
    h+=`<div class="loan">
      <div class="lname"><div class="n">${l.name}</div>
        <div class="s">досрочно ${money0(l.payoff)} · график ${money0(scheduledAll(l))}</div></div>
      <div style="width:74px"><input type="number" step="0.01" value="${rateOf(l)}"
        data-rate="${l.id}" style="text-align:center;padding:7px"></div>
      <button class="tgl ${on?'on':''}" data-off="${l.id}">${on?'✓':'○'}</button>
    </div>`;
  });
  h+=`<hr class="sep"><button class="btn wide" data-act="back">← Назад</button>
    <button class="btn wide" data-act="reset" style="margin-top:8px;color:#fca5a5">Сбросить все отметки</button></div>`;
  return h;
}

/* ======================= РЕНДЕР И СОБЫТИЯ ======================= */
function render(){
  document.getElementById('todayTag').textContent=human(today())+' '+today().slice(0,4);
  document.querySelectorAll('.tabs button').forEach(b=>
    b.classList.toggle('on',b.dataset.tab===S.view));
  document.getElementById('view').innerHTML=
    S.view==='set'?vSettings():S.view==='pay'?vPay():vSum();
}
let tt;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200);}

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){S.view=tab.dataset.tab;save();render();return;}

  const tg=e.target.closest('[data-pay]');
  if(tg){
    const k=tg.dataset.pay,[lid,date]=k.split('|');
    const l=LOANS.find(x=>x.id===lid),p=l.pays.find(x=>x[0]===date);
    const was=isPaid(l,p);
    S.paid[k]=was?false:today();          // помним дату внесения
    save();
    const s=stats();
    toast(was?`Отметка снята · долг ${money0(s.now)}`
             :`${l.name} · −${money0(p[1])} · осталось ${money0(s.now)}`);
    render();return;
  }

  const off=e.target.closest('[data-off]');
  if(off){const id=off.dataset.off,l=LOANS.find(x=>x.id===id);
    S.off[id]=!isOff(l);save();render();
    toast(S.off[id]?l.name+' исключён из расчёта':l.name+' учитывается');return;}

  const a=e.target.closest('[data-act]');
  if(!a)return;
  switch(a.dataset.act){
    case 'settings':S.view='set';save();render();break;
    case 'back':S.view='sum';save();render();break;
    case 'reset':
      if(confirm('Снять все отметки об оплате?')){S.paid={};save();render();toast('Отметки сброшены');}
      break;
    case 'export':{
      const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      const u=URL.createObjectURL(blob),a2=document.createElement('a');
      a2.href=u;a2.download='debt-tracker-'+today()+'.json';a2.click();
      URL.revokeObjectURL(u);toast('Файл сохранён');break;}
    case 'import':{
      const i=document.createElement('input');i.type='file';i.accept='.json';
      i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
        r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();render();toast('Данные загружены');}
          catch(err){toast('Не удалось прочитать файл');}};r.readAsText(f);};
      i.click();break;}
  }
});
document.addEventListener('change',e=>{
  const r=e.target.closest('[data-rate]');
  if(!r)return;
  const v=parseFloat(r.value);
  if(!isFinite(v)||v<0||v>5)return toast('Ставка от 0 до 5% в день');
  S.rateAdj[r.dataset.rate]=v;save();render();toast('Ставка обновлена');
});

load();render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
